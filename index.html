     第一行是必应（Bing Webmaster Tools）的，第二行是 Google（Search Console）的；以后登记别的搜索引擎，照样各加一行。 -->
<meta name="msvalidate.01" content="A3C80A78B5C037D19008D85251D5FB00">
<meta name="google-site-verification" content="G1IEG8WgD2300bTlhHv0sgD6svyEm0YdjHAwRWC1clg">
<!-- 网站的小图标（红底白色的 b）：浏览器标签、收藏夹、搜索结果里网站名旁边显示的就是它。
     搜索引擎只认单独的图片文件，所以放了几种大小；要换图标，把这四个文件一起换掉。 -->
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="96x96" href="favicon-96.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- 这个文件只是页面的骨架。要改文字和内容，请看 config/ 和 content/ 两个文件夹；详见 README.md
     下面每个文件名后的 ?v=日期 是版本号：改过任何文件后，把所有 ?v= 后面的数字一起改成新日期，
     读者的浏览器就会重新下载，而不是沿用旧文件。 -->
<link rel="stylesheet" href="css/fonts.css?v=2026111626">
<link rel="stylesheet" href="css/theme.css?v=2026111626">
<link rel="stylesheet" href="css/base.css?v=2026111626">
<link rel="stylesheet" href="css/layout.css?v=2026111626">
<link rel="stylesheet" href="css/pages.css?v=2026111626">
<link rel="stylesheet" href="css/three-pane.css?v=2026111626">
<link rel="stylesheet" href="css/two-pane.css?v=2026111626">
<link rel="stylesheet" href="css/dict.css?v=2026111626">
</head>
<body>

<header class="site-head">
  <div class="in">
    <!-- 网站名和它旁边的小印章（config/site.js 的 title、seal）。印章在手机上不显示 -->
    <a class="brand" id="brand" href="#home"><span id="brand-name"></span><span class="seal" aria-hidden="true" hidden><span id="brand-seal" dir="rtl" lang="und-Ougr"></span></span></a>
    <nav class="nav" id="nav" aria-label="对照转写"></nav>
    <nav class="nav nav-right" id="nav-right" aria-label="栏目"></nav>
  </div>
</header>

<!-- 首页 -->
<main class="view wrap home" id="v-home">
  <!-- 首页最上面：一行标题（config/site.js 的 lead）和“试一试”——输入转写，右边随即写出原文，按回车查词典。
       内容由 js/pages/home.js 填写 -->
  <div class="hero" id="home-hero">
    <div class="hero-main">
      <h1 class="hero-title" id="home-lead"></h1>
      <p class="origin" id="home-origin"></p>
      <form class="hero-try" id="home-try" role="search">
        <div class="hero-langs" id="home-try-langs" role="group" aria-label="选择文字"></div>
        <div class="hero-row">
          <input type="text" id="home-try-q" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="转写或汉字">
          <button type="submit" class="btn primary">查词典</button>
        </div>
        <p class="small" id="home-try-note"></p>
      </form>
    </div>
    <div class="hero-script" id="home-try-script" aria-live="polite"></div>
  </div>
  <section class="saying-band" aria-label="名句">
    <button type="button" class="btn say-next" id="say-next">换一句</button>
    <div class="saying" id="saying" aria-live="polite"></div>
  </section>
  <section id="home-dicts">
    <div class="sec-head"><h2>查词</h2></div>
    <p class="small" id="home-dict-intro"></p>
    <div class="tool-cards" id="home-dict-links"></div>
  </section>
  <section id="home-tools-sec">
    <div class="sec-head"><h2>对照转写</h2></div>
    <div class="tool-cards" id="home-tools"></div>
  </section>
  <section>
    <div class="sec-head"><h2>新近文章</h2><a class="meta" href="#texts">全部文章 →</a></div>
    <div id="home-texts"></div>
  </section>
  <!-- 开发中的编辑器（config/languages.js 里写了 wip 的）：只在最底下列一行小字 -->
  <p class="small home-wip" id="home-wip-sec" hidden></p>
</main>

<!-- 文章目录 -->
<main class="view wrap" id="v-texts" hidden>
  <!-- 栏目的标题：显示这个栏目时，js/router.js 把它换成 h1；没显示时是 div，这样整个网页始终只有一个 h1 -->
  <div class="sec-head plain"><div class="vh" data-h1>文章</div><span class="meta" id="texts-count"></span></div>
  <div class="groups" id="texts-groups"></div>
</main>

<!-- 单篇文章 -->
<main class="view wrap" id="v-text" hidden></main>

<!-- 资料 -->
<main class="view wrap" id="v-mats" hidden>
  <div class="sec-head plain"><div class="vh" data-h1>资料库</div><span class="meta" id="mats-count"></span></div>
  <p class="small" id="mats-contact" hidden></p>
  <!-- 语言筛选和搜索框：都由 js/pages/materials.js 管 -->
  <div class="mats-bar">
    <div class="lang-filter" id="mats-filter" role="group" aria-label="按语言筛选"></div>
    <input type="search" class="mats-q" id="mats-q" placeholder="搜书名、作者" aria-label="搜索资料" autocomplete="off" spellcheck="false">
  </div>
  <div class="groups" id="mats-groups"></div>
</main>

<!-- 全部名句 -->
<main class="view wrap" id="v-says" hidden></main>

<!-- 问题反馈：内容由 js/pages/contact.js 生成 -->
<main class="view wrap" id="v-contact" hidden></main>

<!-- 编辑器：内容由 js/editors/ 里的文件生成 -->
<main class="view wrap" id="v-tri" hidden></main>
<main class="view wrap" id="v-mm" hidden></main>

<!-- 词典：内容由 js/pages/dict.js 生成 -->
<main class="view" id="v-dict" hidden></main>

<footer class="site-foot">
  <!-- foot-stats 是访问计数，由 js/counter.js 填写；读不到数字时不显示 -->
  <div class="in"><span class="foot-name" id="foot-name"></span><span class="foot-stats" id="foot-stats" hidden></span><span class="foot-meta" id="foot-meta"></span></div>
</footer>
<div class="toast" id="toast" hidden></div>

<!-- 载入顺序不能乱：先命名空间，再配置和内容，再转换规则和编辑器，然后是各栏目和路由，最后是访问计数 -->
<script src="js/siyi.js?v=2026111626"></script>
<script src="js/routes.js?v=2026111626"></script>

<script src="config/site.js?v=2026111626"></script>
<script src="config/languages.js?v=2026111626"></script>
<script src="config/dictionaries.js?v=2026111626"></script>

<script src="content/texts.js?v=2026111626"></script>
<script src="content/materials.js?v=2026111626"></script>
<script src="content/sayings.js?v=2026111626"></script>

<script src="js/data/turkic-corpus.js?v=2026111626"></script>
<script src="js/converters/turkic-common.js?v=2026111626"></script>
<script src="js/converters/old-uyghur.js?v=2026111626"></script>
<script src="js/converters/old-turkic.js?v=2026111626"></script>
<script src="js/converters/manchu.js?v=2026111626"></script>
<script src="js/converters/mongolian.js?v=2026111626"></script>
<script src="js/converters/tibetan.js?v=2026111626"></script>
<script src="js/converters/chagatai.js?v=2026111626"></script>
<!-- 新加的转换规则放在这一行上面，如 <script src="js/converters/xxx.js?v=2026111626"></script> -->

<script src="js/dict/translit-mnc.js?v=2026111626"></script>
<script src="js/dict/translit-mn.js?v=2026111626"></script>
<script src="js/dict/def-match.js?v=2026111626"></script>
<script src="js/dict/card-image.js?v=2026111626"></script>
<script src="js/dict/core.js?v=2026111626"></script>
<script src="js/dict/tibetan-dicts.js?v=2026111626"></script>
<script src="js/dict/dictionaries.js?v=2026111626"></script>

<script src="js/editors/three-pane.js?v=2026111626"></script>
<script src="js/gloss.js?v=2026111626"></script>
<script src="js/editors/two-pane.js?v=2026111626"></script>

<script src="js/pages/shared.js?v=2026111626"></script>
<script src="js/pages/sayings.js?v=2026111626"></script>
<script src="js/pages/texts.js?v=2026111626"></script>
<script src="js/pages/materials.js?v=2026111626"></script>
<script src="js/pages/home.js?v=2026111626"></script>
<script src="js/pages/contact.js?v=2026111626"></script>
<script src="js/pages/dict.js?v=2026111626"></script>
<script src="js/router.js?v=2026111626"></script>
<script src="js/counter.js?v=2026111626"></script>
</body>
</html>

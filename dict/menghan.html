<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>蒙汉词典 · bitig</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%239B2B20'/%3E%3Ctext x='33' y='47' text-anchor='middle' font-family='Georgia,serif' font-style='italic' font-size='44' fill='%23fbfbf8'%3Eb%3C/text%3E%3C/svg%3E">
<!-- 词典页面。查询程序在 dict/core.js，样式在 dict/dict.css，词库在 dict/data/；
     词库由 dict/tools/build_data.py 从栗林均词典的 CSV 生成。下面只是这部词典自己的设置。 -->
<link rel="stylesheet" href="../css/fonts.css?v=2026110601">
<link rel="stylesheet" href="../css/theme.css?v=2026110601">
<link rel="stylesheet" href="dict.css?v=2026110601">
</head>
<body>
<header>
  <div class="brand"><a class="home" href="../index.html">bitig</a><h1>蒙汉词典</h1></div>
  <form class="search" id="form" role="search">
    <input id="q" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="转写或释义">
    <select id="mode" aria-label="查询方式">
      <option value="smart">综合</option>
      <option value="prefix">词首</option>
      <option value="contain">包含</option>
      <option value="fuzzy">近似拼写</option>
      <option value="def">释义反查</option>
    </select>
  </form>
  <div class="source">数据来源<b>栗林均词典</b></div>
  <div class="filters" id="filters"></div>
  <div class="legend" id="legend">
    <h3>蒙古文转写（学术转写）</h3>
    <dl>
      <div><dt>γ</dt><dd>也可打 G 或 gh</dd></div>
      <div><dt>č</dt><dd>也可打 c 或 ch</dd></div>
      <div><dt>ǰ</dt><dd>也可打 j</dd></div>
      <div><dt>š</dt><dd>也可打 S 或 sh</dd></div>
      <div><dt>ö</dt><dd>也可打 O</dd></div>
      <div><dt>ü</dt><dd>也可打 U</dd></div>
      <div><dt>ē</dt><dd>也可打 E</dd></div>
      <div><dt>-a、-e</dt><dd>词末分写的 a、e</dd></div>
      <div><dt>-un 等</dt><dd>附加成分前的分隔</dd></div>
    </dl>
    <p>结果中的转写一律用正式写法。查询时不分 q 与 k、γ 与 g，ö 与 o、ü 与 u、š 与 s 也可互通；用 * 代替任意多个字母，? 代替一个字母。输入汉字则在释义中反查。点击词条空白处，左栏改显示该词条的原文。</p>
  </div>
</header>
<main>
  <aside class="spine" id="spine" aria-label="原文"></aside>
  <section class="results" id="results" aria-live="polite">
    <div class="status" id="status">正在载入词库…</div>
    <div class="list" id="list"></div>
  </section>
</main>
<script src="translit-mn.js?v=2026110601"></script>
<script src="core.js?v=2026110601"></script>
<script>
(function () {
  var D = MN.display, INDEX = {};
  var normSc = function (s) { return s.replace(/[᠋-᠍‍]/g, '').replace(/[\s ]+/g, ' ').trim(); };
  // 释义里的蒙古文：词库中有这个词头的，点一下即可查询
  function mongolLinks(html) {
    return html.split(/(<[^>]+>)/).map(function (part) {
      if (part.charAt(0) === '<') return part;
      return part.replace(/[᠀-᢯‍]+(?:[ ᠎][᠀-᢯]+)*(?:\([᠀-᢯]+\))?/g, function (run) {
        var k = INDEX[normSc(run)];
        if (k === undefined) return '<span class="mn-in plain">' + run + '</span>';
        var d = D(k);
        return '<span class="mn-in" data-q="' + d.replace(/"/g, '&quot;') + '" data-in="mn" title="' + d.replace(/"/g, '&quot;') + '">' + run + '</span>';
      });
    }).join('');
  }
  function uniq(arr) { return arr.filter(function (x, i) { return x && arr.indexOf(x) === i; }); }
  DictApp({
    data: 'data/menghan.txt?v=2026110601', storeKey: 'dict-menghan-', colLang: 'mn',
    dicts: [{ name: '蒙汉词典', seal: '蒙' }],
    inputs: [{ id: 'mn', label: '蒙文转写', lang: MN, placeholder: '输入蒙古文转写，如 mongγol、bičig；也可输入汉字反查' }],
    sense: function (f) { return { d: f[0], hom: f[1], page: f[2], def: f[3], ipa: f[4], cyr: f[5] }; },
    looseOf: function (e) { return e.key.split('～').map(function (r) { return { r: r.trim() }; }); },
    senseText: function (s) { return s.def; },
    loaded: function (E) { E.forEach(function (e) { var k = normSc(e.script); if (!(k in INDEX)) INDEX[k] = e.key; }); },
    head: function (e, c) {
      var d = D(e.key), ss = c.H.senses(e);
      var cyr = uniq(ss.map(function (s) { return s.cyr; })), ipa = uniq(ss.map(function (s) { return s.ipa; }));
      return '<button class="tl" data-q="' + c.H.esc(d) + '" data-in="mn">' + c.H.markDisplay(MN, d, c.q) + '</button>' +
        (cyr.length || ipa.length ? '<span class="aux">' + (cyr.length ? '<span class="cyr" lang="mn-Cyrl">' + c.H.esc(cyr.join('，')) + '</span> ' : '') +
          (ipa.length ? '<span class="ipa">[' + c.H.esc(ipa.join('] [')) + ']</span>' : '') + '</span>' : '');
    },
    senseHtml: function (s, c) {
      return '<span class="src">页 ' + c.H.esc(s.page) + (s.hom ? ' <i>/' + c.H.esc(s.hom) + '</i>' : '') + '</span>' +
        '<span class="def">' + mongolLinks(c.H.markTerms(s.def)) + '</span>';
    },
    col: function (e) { return e.script; },
    spine: function (c) {
      if (c.q && !c.def && !c.selectedEntry) return c.H.pane({ lbl: '蒙文', lang: 'mn', script: MN.toScript(MN.normInput(c.q)), tl: MN.normInput(c.q) });
      if (c.top && (c.def || c.selectedEntry)) return c.H.pane({ lbl: '蒙文', lang: 'mn', script: c.top.script, tl: D(c.top.key), from: c.selectedEntry ? '所选词条' : '首条结果' });
      return c.H.pane({ lbl: '蒙文', empty: '蒙古文随输入显示' });
    },
    intro: '<h2>输入蒙古文转写开始查询</h2>' +
      '<p>输入时左栏随即写出蒙古文。学术写法和栗林均的写法都可以输入，结果中的转写一律用学术写法。词条另附西里尔蒙古文和国际音标；释义里的蒙古文词点一下即可查询。</p><p>' +
      ['mongγol', 'bičig', 'aγula', 'köke', 'usu'].map(function (w) { return '<span class="eg" data-q="' + w + '" data-in="mn">' + w + '</span>'; }).join('') +
      ['马', '学问'].map(function (w) { return '<span class="eg zh" data-q="' + w + '">' + w + '</span>'; }).join('') + '</p>'
  });
})();
</script>
</body>
</html>

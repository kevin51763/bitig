const NNBSP = " ";
function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
function parseMorphs(spec, tr, zh){
  if(!spec) return [{form:tr.replace(/[“”.,!:]/g,""), gloss:zh, kind:"root"}];
  return spec.split(" ").map(s=>{
    const i=s.indexOf("="); let form=s.slice(0,i); const gloss=s.slice(i+1);
    let kind="root";
    if(form.startsWith("-")) kind="vfx";
    else if(form.startsWith("+")){ kind="part"; form=form.slice(1); }
    if(/格/.test(gloss)) kind="case";
    return {form, gloss, kind};
  });
}
function chip(m){ return el("span","chip "+m.kind, m.gloss); }
function tokEl(str){
  const [tr, , zh, spec] = str.split("|");
  const box=el("div","tok");
  box.appendChild(el("div","tr",tr));
  const ms=parseMorphs(spec,tr,zh);
  if(!zh){ const z=el("div","zh"); ms.forEach(m=>z.appendChild(chip(m))); box.appendChild(z); return box; }
  box.appendChild(el("div","zh",zh));
  if(ms.length>1){
    const mo=el("div","mo");
    ms.forEach(m=>{
      const p=el("span","mp "+(m.kind==="root"?"root":""));
      p.appendChild(el("b",null,m.form));
      p.appendChild(m.kind==="root"? el("i",null,m.gloss) : chip(m));
      mo.appendChild(p);
    });
    box.appendChild(mo);
  }
  return box;
}
function cellTl(toks, side){
  const c=el("div","c tl "+side);
  if(!toks.length) c.appendChild(el("span","none","—"));
  toks.forEach(t=>c.appendChild(tokEl(t)));
  return c;
}
function cellSc(toks, side){
  const c=el("div","c sc "+side);
  c.lang = side==="m" ? "mn-Mong" : "mnc-Mong";
  if(!toks.length) c.appendChild(el("span","none","—"));
  toks.forEach(t=>c.appendChild(el("span","v", t.split("|")[1].replace(/_/g,NNBSP))));
  return c;
}
const table=document.getElementById("table");
DATA.forEach(s=>{
  const h=el("div","sent");
  h.appendChild(el("span","num",s.n));
  h.appendChild(el("p",null,s.zh));
  table.appendChild(h);
  s.rows.forEach(([m,j,note])=>{
    const r=el("div","row");
    r.append(cellTl(m,"m"), cellSc(m,"m"), cellSc(j,"j"), cellTl(j,"j"));
    if(note) r.appendChild(el("div","note",note));
    table.appendChild(r);
  });
});
const tg=document.getElementById("mo-toggle");
try{ if(localStorage.getItem("yg-mo")==="0"){ tg.checked=false; document.body.classList.add("hide-mo"); } }catch(e){}
tg.addEventListener("change",()=>{
  document.body.classList.toggle("hide-mo",!tg.checked);
  try{ localStorage.setItem("yg-mo",tg.checked?"1":"0"); }catch(e){}
});
